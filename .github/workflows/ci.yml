name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: true
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quick2learn_test
  DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/quick2learn_test
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/quick2learn_test
  BETTER_AUTH_SECRET: test_auth_secret_ci_32chars_minimum_length_required!
  BETTER_AUTH_URL: http://localhost:3000
  RAZORPAY_KEY_ID: rzp_test_ci_mock1234
  RAZORPAY_KEY_SECRET: rzp_sec_ci_mock5678
  RAZORPAY_WEBHOOK_SECRET: rzp_whsec_ci_mock9012
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_mock1234

jobs:
  test:
    name: Lint, Typecheck, Unit & Data-Layer Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quick2learn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Database Migrations
        run: pnpm db:migrate

      - name: Turbo Lint
        run: pnpm lint

      - name: Turbo Typecheck
        run: pnpm typecheck

      - name: Run Vitest Unit & Data-Layer Tests
        run: pnpm test

      - name: Build Web Application
        run: pnpm build

  e2e:
    name: Playwright End-to-End Tests
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [test]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quick2learn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        command: server /data --console-address ":9001"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium Browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Database Migrations & Seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Build Application for E2E
        run: pnpm build

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e

      - name: Upload Playwright Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
