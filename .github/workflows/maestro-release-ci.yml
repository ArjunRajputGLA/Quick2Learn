name: Mobile Maestro Release E2E

on:
  push:
    branches:
      - "main"
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "release/**"

concurrency:
  group: maestro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-android:
    name: Maestro E2E Flows on Android Emulator
    runs-on: macos-14
    timeout-minutes: 60

    env:
      CI: true
      NODE_ENV: test
      EXPO_PUBLIC_API_URL: http://10.0.2.2:3000
      BETTER_AUTH_SECRET: ci_test_auth_secret_minimum_32_characters_long!
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Maestro CLI
        run: |
          curl -FsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Build Android Debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Run Maestro Flows on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb install apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/sign-in.yaml
            maestro test .maestro/play-lecture.yaml
            maestro test .maestro/download-pdf-offline.yaml
            maestro test .maestro/take-test.yaml
            maestro test .maestro/ask-doubt.yaml
            maestro test .maestro/parent-switch-children.yaml

      - name: Upload Maestro Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results
          path: ~/.maestro/tests/
          retention-days: 7
